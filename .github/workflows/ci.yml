name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests/SortJson.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = './Tests/testResults.xml'

          $result = Invoke-Pester -Configuration $config

          # Write a summary table to the GitHub run summary
          $lines = @(
              "## Pester Results ($env:RUNNER_OS)"
              ""
              "| Result | Count |"
              "|--------|-------|"
              "| Passed | $($result.PassedCount) |"
              "| Failed | $($result.FailedCount) |"
              "| Skipped | $($result.SkippedCount) |"
              "| Total | $($result.TotalCount) |"
              ""
              "Duration: $($result.Duration)"
          )
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: ./Tests/testResults.xml
          if-no-files-found: warn
